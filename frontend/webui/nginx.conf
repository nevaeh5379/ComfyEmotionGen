server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml
        text/css
        text/plain;

    # Vite fingerprints production assets, so they can be cached permanently.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Always revalidate the entry document so new asset hashes are discovered.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # /config.js is rewritten at container start by docker-entrypoint.d/40-write-config.sh
    location = /config.js {
        add_header Cache-Control "no-store" always;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
